<!doctype html>
<meta charset="utf-8">
<title>くじ引きドロー</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@400;500;700;900&family=Klee+One:wght@600&display=swap');

  :root{
    --paper: #fbf4e8;
    --card: #fffcf6;
    --ink: #2b2630;
    --ink-soft: #7a7085;
    --red: #e2483a;
    --red-deep: #c23327;
    --navy: #2e3a59;
    --gold: #e8a93b;
    --sky: #bfe1ee;
    --line: rgba(43,38,48,0.12);
    --shadow: 0 18px 40px -18px rgba(43,38,48,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #1b1720;
      --card: #241f2c;
      --ink: #f3ece3;
      --ink-soft: #b9aec2;
      --red: #ff6b5b;
      --red-deep: #ff8977;
      --navy: #a9b8e6;
      --gold: #f5c169;
      --sky: #4a6c82;
      --line: rgba(255,255,255,0.14);
      --shadow: 0 18px 44px -16px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --paper: #1b1720;
    --card: #241f2c;
    --ink: #f3ece3;
    --ink-soft: #b9aec2;
    --red: #ff6b5b;
    --red-deep: #ff8977;
    --navy: #a9b8e6;
    --gold: #f5c169;
    --sky: #4a6c82;
    --line: rgba(255,255,255,0.14);
    --shadow: 0 18px 44px -16px rgba(0,0,0,0.6);
  }

  *{ box-sizing: border-box; }
  html, body{ height:100%; }
  body{
    margin:0;
    min-height:100dvh;
    background:
      radial-gradient(60% 50% at 50% -10%, color-mix(in srgb, var(--sky) 35%, transparent), transparent 70%),
      var(--paper);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding: 16px;
  }
  .page{
    width:100%;
    height:100%;
    max-width: 1400px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 18px;
  }

  .stage{
    position:relative;
    /* Fill as much of the viewport as possible while keeping the video's
       native aspect ratio: width is capped by both the available width
       and by what the available height allows (so on tall/narrow screens
       it's height-limited, and on wide screens it's width-limited). */
    width: min(100%, calc((100dvh - 110px) * 1764 / 1176));
    aspect-ratio: 1764 / 1176;
    border-radius: 28px;
    background: var(--card);
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    overflow:hidden;
    isolation:isolate;
  }
  .scene{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit: cover;
    display:block;
    background: var(--card);
  }

  .name-slot{
    position:absolute;
    left: 35%;
    top: 50.2%;
    width: 6.8%;
    height: 20%;
    transform: translate(-50%, -50%) rotate(-20.2deg);
    opacity: 0;
    z-index: 2;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    will-change: left, top, width, height, transform, opacity, filter;
  }
  #nameText{
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: "Klee One", "Zen Maru Gothic", sans-serif;
    font-weight: 900;
    -webkit-text-stroke: 0.6px currentColor;
    color: #201c22;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .replay{
    appearance:none;
    border: none;
    cursor:pointer;
    font-family: inherit;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: .02em;
    color: #fff;
    background: linear-gradient(180deg, var(--red) 0%, var(--red-deep) 100%);
    padding: 13px 26px;
    border-radius: 999px;
    box-shadow: 0 10px 22px -8px color-mix(in srgb, var(--red) 70%, transparent);
    opacity: 0;
    transform: translateY(6px) scale(.96);
    pointer-events:none;
    transition: opacity .35s ease, transform .35s ease, box-shadow .2s ease;
  }
  .replay.is-visible{
    opacity:1;
    transform: translateY(0) scale(1);
    pointer-events:auto;
  }
  .replay:hover{ box-shadow: 0 12px 26px -8px color-mix(in srgb, var(--red) 80%, transparent); }
  .replay:active{ transform: translateY(0) scale(.97); }
  .replay:focus-visible{ outline: 3px solid var(--gold); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce){
    .replay{ transition: opacity .2s linear; }
  }

  .tap-start{
    position:absolute;
    inset:0;
    z-index: 3;
    display:none;
    align-items:center;
    justify-content:center;
    background: color-mix(in srgb, var(--ink) 35%, transparent);
    border:none;
    cursor:pointer;
    padding:0;
  }
  .tap-start.is-visible{ display:flex; }
  .tap-start span{
    font-family: inherit;
    font-weight: 900;
    font-size: 16px;
    letter-spacing: .02em;
    color: #fff;
    background: linear-gradient(180deg, var(--red) 0%, var(--red-deep) 100%);
    padding: 14px 28px;
    border-radius: 999px;
    box-shadow: 0 10px 22px -8px rgba(0,0,0,0.5);
  }
</style>

<div class="page">
  <div class="stage" id="stage" aria-live="polite">
    <video class="scene" id="video" src="draw-reveal.mp4" muted playsinline preload="auto"></video>
    <div class="name-slot" id="nameSlot"><span id="nameText"></span></div>
    <button class="tap-start" id="tapStart" type="button"><span>タップして再生</span></button>
  </div>

  <button class="replay" id="replay" type="button">もう一度引く</button>
</div>

<script>
(function(){
  "use strict";

  var NAMES = ["もり", "のすけ", "はう", "せいや", "たくみ", "けんご"];

  // Measured (via frame-by-frame analysis) path of the card's blank interior
  // as it unfolds and settles: the card is still moving right up until
  // almost the end of the clip, so the name overlay follows the same path
  // instead of popping in at a fixed spot.
  //
  // Before ~3.667s the card is still a folded, closed strip (no blank face
  // is visible at all — just its red exterior), so there is nothing for the
  // text to align with yet. The blank interior first becomes visible/
  // measurable right around t=3.667, which is why PATH now starts there
  // instead of at 3.750: those two extra early points were measured the
  // same way as the rest (contour detection on the real frame) and verified
  // against the source frames pixel-for-pixel.
  var PATH = [
    { t: 3.667, cx: 0.3929, cy: 0.4677, w: 0.0726, h: 0.2015, ang: -25.7 },
    { t: 3.708, cx: 0.3844, cy: 0.4634, w: 0.0737, h: 0.1990, ang: -24.7 },
    { t: 3.750, cx: 0.3765, cy: 0.4620, w: 0.0763, h: 0.2088, ang: -22.38 },
    { t: 3.875, cx: 0.3637, cy: 0.4686, w: 0.0763, h: 0.2144, ang: -21.04 },
    { t: 4.000, cx: 0.3613, cy: 0.4792, w: 0.0747, h: 0.2168, ang: -20.07 },
    { t: 4.125, cx: 0.3568, cy: 0.4890, w: 0.0744, h: 0.2190, ang: -19.70 },
    { t: 4.250, cx: 0.3563, cy: 0.4969, w: 0.0746, h: 0.2196, ang: -19.86 },
    { t: 4.375, cx: 0.3561, cy: 0.5034, w: 0.0746, h: 0.2180, ang: -20.04 },
    { t: 4.500, cx: 0.3533, cy: 0.5060, w: 0.0747, h: 0.2172, ang: -20.30 },
    { t: 4.625, cx: 0.3513, cy: 0.5051, w: 0.0747, h: 0.2175, ang: -20.18 },
    { t: 4.750, cx: 0.3501, cy: 0.5031, w: 0.0746, h: 0.2182, ang: -20.24 },
    { t: 4.875, cx: 0.3498, cy: 0.5023, w: 0.0746, h: 0.2170, ang: -20.24 },
    { t: 5.042, cx: 0.3499, cy: 0.5024, w: 0.0747, h: 0.2165, ang: -20.22 }
  ];
  // Start the gradient exactly when the card's blank face first becomes
  // visible (PATH[0].t) — starting any earlier has nothing real to fade in
  // over (the card is still a closed, folded strip with no blank face and
  // no measurable position), which is what produced a floating text
  // "ghost" detached from the actual card. From here on every frame in the
  // gradient uses a real measured position, so the text and paper move
  // together the entire time it's materializing.
  var FADE_START = PATH[0].t;
  var CLEAR_BY = 3.90;

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var video = document.getElementById("video");
  var nameSlot = document.getElementById("nameSlot");
  var nameText = document.getElementById("nameText");
  var replayBtn = document.getElementById("replay");
  var tapStartBtn = document.getElementById("tapStart");
  var stageEl = document.getElementById("stage");

  var timers = [];
  var rafId = null;
  var fontFitted = false;

  function clearTimers(){
    timers.forEach(function(t){ clearTimeout(t); });
    timers = [];
  }

  function lerp(a, b, k){ return a + (b - a) * k; }

  function samplePath(t){
    var last = PATH[PATH.length - 1];
    if (t <= PATH[0].t) return PATH[0];
    if (t >= last.t) return last;
    for (var i = 0; i < PATH.length - 1; i++){
      var a = PATH[i], b = PATH[i + 1];
      if (t >= a.t && t <= b.t){
        var k = (t - a.t) / (b.t - a.t);
        return {
          cx: lerp(a.cx, b.cx, k), cy: lerp(a.cy, b.cy, k),
          w: lerp(a.w, b.w, k), h: lerp(a.h, b.h, k),
          ang: lerp(a.ang, b.ang, k)
        };
      }
    }
    return last;
  }

  function fitNameFont(text){
    var last = PATH[PATH.length - 1];
    var h = last.h * stageEl.clientHeight;
    var w = last.w * stageEl.clientWidth;
    if (!h || !w){ return 20; }
    var byHeight = h / (text.length * 1.08);
    var byWidth = w * 0.92;
    return Math.max(9, Math.min(byHeight, byWidth));
  }

  var currentTarget = "";

  function updateOverlay(){
    var t = video.currentTime;

    if (reduceMotion){
      var p = PATH[PATH.length - 1];
      nameSlot.style.left = (p.cx * 100) + "%";
      nameSlot.style.top = (p.cy * 100) + "%";
      nameSlot.style.width = (p.w * 100) + "%";
      nameSlot.style.height = (p.h * 100) + "%";
      nameSlot.style.transform = "translate(-50%,-50%) rotate(" + p.ang + "deg)";
      nameSlot.style.filter = "none";
      nameSlot.style.opacity = t >= FADE_START ? "1" : "0";
    } else if (t < FADE_START){
      nameSlot.style.opacity = "0";
    } else {
      var pos = samplePath(t);
      var progress = Math.max(0, Math.min(1, (t - FADE_START) / (CLEAR_BY - FADE_START)));
      var eased = progress * progress * (3 - 2 * progress); // smoothstep
      // pos.w/pos.h are the card's real measured size at this instant (PATH
      // now starts right when the blank face first appears), so the box is
      // already sized to the true paper — no extra artificial scaling is
      // layered on top, which is what previously let the box sit at the
      // wrong place while shrunk. Only opacity/blur carry the "materializing"
      // feel now, over real, continuously-tracked geometry.
      nameSlot.style.left = (pos.cx * 100) + "%";
      nameSlot.style.top = (pos.cy * 100) + "%";
      nameSlot.style.width = (pos.w * 100) + "%";
      nameSlot.style.height = (pos.h * 100) + "%";
      nameSlot.style.transform = "translate(-50%,-50%) rotate(" + pos.ang + "deg)";
      nameSlot.style.opacity = String(lerp(0.15, 1, eased));
      nameSlot.style.filter = "blur(" + lerp(8, 0, eased) + "px)";
    }

    if (!fontFitted && t >= FADE_START){
      fontFitted = true;
      nameText.style.fontSize = fitNameFont(currentTarget) + "px";
    }

    rafId = requestAnimationFrame(updateOverlay);
  }

  function onEnded(){
    timers.push(setTimeout(function(){
      replayBtn.classList.add("is-visible");
    }, reduceMotion ? 150 : 300));
  }

  function playSequence(){
    clearTimers();
    replayBtn.classList.remove("is-visible");
    tapStartBtn.classList.remove("is-visible");
    nameSlot.style.opacity = "0";
    fontFitted = false;
    currentTarget = NAMES[Math.floor(Math.random() * NAMES.length)];
    nameText.textContent = currentTarget;

    video.pause();
    video.currentTime = 0;
    var playNow = function(){ video.play().catch(function(){}); };
    // Some browsers need a tick after seeking back to 0 before play() takes;
    // try immediately and once more on the next frame as a fallback.
    playNow();
    requestAnimationFrame(playNow);

    // Some browsers (notably when this page is opened as a local file
    // rather than served from a site) block the very first autoplay
    // attempt even though the video is muted. If playback still hasn't
    // actually started shortly after, show a tap-to-play button instead of
    // silently sitting on the first frame — a real click always satisfies
    // the browser's autoplay requirement.
    timers.push(setTimeout(function(){
      if (video.paused){
        tapStartBtn.classList.add("is-visible");
      }
    }, 400));
  }

  video.addEventListener("playing", function(){
    tapStartBtn.classList.remove("is-visible");
  });
  video.addEventListener("ended", onEnded);
  replayBtn.addEventListener("click", playSequence);
  tapStartBtn.addEventListener("click", function(){
    tapStartBtn.classList.remove("is-visible");
    video.play().catch(function(){});
  });
  window.addEventListener("resize", function(){
    if (currentTarget) nameText.style.fontSize = fitNameFont(currentTarget) + "px";
  });

  playSequence();
  rafId = requestAnimationFrame(updateOverlay);
})();
</script>
